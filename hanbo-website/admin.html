<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>留言管理 · 广东汉柏能源集团（演示）</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:#F4F9FC;color:#12303F;padding:30px 20px}
.wrap{max-width:960px;margin:0 auto}
h1{font-size:22px;color:#0A2F4E;margin-bottom:4px}
.note{background:#FFF7E8;border:1px solid #F0C27B;color:#8A5B12;font-size:13px;padding:10px 14px;border-radius:8px;margin:12px 0 20px;line-height:1.6}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px}
.bar .cnt{font-size:14px;color:#5C7080}
.bar button{padding:8px 18px;border:none;border-radius:8px;background:#0E6BA8;color:#fff;font-size:14px;cursor:pointer}
.bar button:hover{background:#0D5D94}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 8px 24px rgba(10,47,78,.08);font-size:14px}
th{background:#0A2F4E;color:#fff;text-align:left;padding:11px 14px;font-size:13px;letter-spacing:1px}
td{padding:11px 14px;border-bottom:1px solid #E2EDF4;vertical-align:top}
tr:last-child td{border-bottom:none}
td.msg{color:#5C7080;max-width:340px}
td.time{white-space:nowrap;color:#5C7080;font-size:13px}
.empty{background:#fff;border-radius:10px;padding:50px 20px;text-align:center;color:#5C7080;box-shadow:0 8px 24px rgba(10,47,78,.06)}
.back{display:inline-block;margin-top:20px;color:#0E6BA8;font-size:14px;text-decoration:none}
.back:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="wrap">
  <h1>💬 留言管理（演示页面）</h1>
  <div class="note">
    ⚠️ <b>演示用后台</b>：当前任何人都能访问本页。正式上线前，请给 <code>/api/messages</code> 接口加上登录认证，
    或让技术人员把留言对接公司邮箱 / 企业微信 / CRM 系统。届时可直接关闭本页。
  </div>
  <div class="bar">
    <span class="cnt" id="cnt">加载中…</span>
    <button onclick="load()">↻ 刷新</button>
  </div>
  <div id="list"></div>
  <a class="back" href="/">← 返回网站首页</a>
</div>

<script>
function esc(s){ var d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }
function load(){
  var box = document.getElementById('list');
  fetch('/api/messages').then(function(r){ return r.json(); }).then(function(res){
    var list = res.messages || [];
    document.getElementById('cnt').textContent = '共 ' + list.length + ' 条留言';
    if(!list.length){
      box.innerHTML = '<div class="empty">还没有留言。<br>去网站首页的联系表单提交一条试试 →</div>';
      return;
    }
    var html = '<table><tr><th>时间</th><th>姓名</th><th>电话</th><th>邮箱</th><th>留言内容</th></tr>';
    list.forEach(function(m){
      html += '<tr><td class="time">' + esc(m.time) + '</td><td><b>' + esc(m.name) + '</b></td>' +
              '<td>' + esc(m.tel) + '</td><td>' + esc(m.email || '—') + '</td>' +
              '<td class="msg">' + esc(m.message) + '</td></tr>';
    });
    box.innerHTML = html + '</table>';
  }).catch(function(){
    box.innerHTML = '<div class="empty">读取失败：请确认已用 <code>node server.js</code> 启动后端服务。</div>';
  });
}
load();
</script>
</body>
</html>
